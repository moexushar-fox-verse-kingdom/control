.tg{flex:none;width:46px;height:26px;border-radius:99px;border:0;background:#cbd5e1;position:relative;transition:.2s;padding:0}
.tg:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--gr)}.tg.on:after{left:23px}

function lgInfo(l){const m=String(l.error||'');for(const r of LGX)if(r[0].test(m))return{sv:r[1],t:r[2],why:r[3],fx:r[4],fix:r[5]};
 return{sv:1,t:'অজানা error',why:'এই error আগে থেকে চেনা তালিকায় নেই।',fx:'ঠিক কী প্রভাব পড়ছে নিশ্চিত নয়; Page ও Source দেখে অনুমান করুন।',fix:'একই error অনেক ইউজারের হলে সমস্যা গুরুতর হতে পারে।'}}
const LGC=['#64748b','#d97706','#e11d48'],LGB=['সাধারণ','সতর্কতা','গুরুতর'];
function seenLogs(){try{return Number(localStorage.getItem('adm_seen_logs'))||0}catch(e){return 0}}
function markLogsSeen(){try{localStorage.setItem('adm_seen_logs',String(Math.max(0,...Object.values(LG).map(l=>Number(l.ts)||0))))}catch(e){}}
function lgCard(l){const x=l._x,c=LGC[x.sv],nm=l.username?'@'+l.username:(l.firstName||'No username');
 return `<div class="card" style="border-left:4px solid ${c}">
 <div class="row" data-user="${esc(l.uid)}" style="cursor:pointer;margin-bottom:8px">${av({firstName:l.firstName,username:l.username})}<div style="min-width:0;flex:1"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nm)}</b><small style="color:var(--mu)">ID ${esc(l.uid)} · ${fmt(l.ts)}</small></div><span class="pill" style="background:${c}22;color:${c}">${LGB[x.sv]}</span></div>
 <div style="font-size:11px;color:var(--mu);margin-bottom:6px">${l.page?'Page: <b>'+esc(l.page)+'</b> · ':''}Source: <b>${esc(l.src||'-')}</b>${l.plat?' · '+esc(l.plat):''}</div>
 <div style="font-weight:800;font-size:13px;margin-bottom:8px">Error: <span style="font-family:ui-monospace,monospace;font-weight:600;word-break:break-word">${esc(l.error)}</span></div>
 <div class="lgx"><b>${esc(x.t)}</b><br>কেন হয়েছে: ${esc(x.why)}<br>সমস্যা কী হচ্ছে: ${esc(x.fx)}${x.fix?'<br>করণীয়: '+esc(x.fix):''}</div>
 <div style="text-align:right;margin-top:8px"><button class="btn gh" style="flex:none;padding:6px 10px;font-size:11.5px" data-lgdel="${esc(l.id)}">${ic('trash',13)} মুছুন</button></div></div>`}
function vLog(){
 const all=Object.entries(LG).map(([id,l])=>({id,...l})).sort((a,b)=>(b.ts||0)-(a.ts||0)),k=qs.toLowerCase();
 all.forEach(l=>{l._x=lgInfo(l)});
 const cnt=n=>all.filter(l=>l._x.sv===n).length,T=(v,t)=>`<button class="${lgf===v?'on':''}" data-lgf="${v}">${t}</button>`;
 const l=all.filter(o=>(lgf==='all'||String(o._x.sv)===lgf)&&(!k||[o.uid,o.username,o.firstName,o.error,o.page,o.src,o._x.t].join(' ').toLowerCase().includes(k))).slice(0,150);
 return hd('Log',all.length,true)+`<div class="tabs">${T('all','সব ('+all.length+')')}${T('2','গুরুতর ('+cnt(2)+')')}${T('1','সতর্কতা ('+cnt(1)+')')}${T('0','সাধারণ ('+cnt(0)+')')}</div>`
  +`<div class="search">${ic('search',17)}<input id="q" placeholder="Username / error খুঁজুন" value="${esc(qs)}"></div>`
  +(all.length?`<div style="display:flex;justify-content:flex-end;margin:-4px 0 10px"><button class="btn gh" style="flex:none;padding:8px 12px;font-size:12px" data-lgclr>${ic('trash',14)} সব Log মুছুন</button></div>`:'')
  +(l.length?l.map(lgCard).join(''):empty('inbox',all.length?'কিছু পাওয়া যায়নি':'এখনো কোনো log নেই'))}
async function lgDel(id){try{await db.ref('logs/'+id).remove();toast('Log মুছে ফেলা হয়েছে')}catch(e){toast('Delete: '+e.message)}}
async function lgClear(){if(!confirm('লোড হওয়া সব Log মুছে ফেলবেন?'))return;try{const up={};Object.keys(LG).forEach(k=>{up[k]=null});await db.ref('logs').update(up);toast('সব Log মুছে ফেলা হয়েছে')}catch(e){toast('Clear: '+e.message)}}
db.ref('logs').orderByKey().limitToLast(300).on('value',s=>{LG=s.val()||{};paintNav();if(tab==='log')draw()},e=>toast('Log: '+e.message));
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-user],[data-go]');if(!t||t.closest('.ov'))return;const d=t.dataset;
 if(d.copy){navigator.clipboard&&navigator.clipboard.writeText(d.copy);return toast('Copied')}if(d.kyc)return kyc(d.kyc);if('stadd' in d){ST=readST();ST.push({refer:1,min:0.5,max:0.5,hint:true,restrict:false,anti:false,antiIp:true,freezeAfter:3});$('#stg').innerHTML=stHtml();return}if(d.strm!==undefined){ST=readST();ST.splice(+d.strm,1);$('#stg').innerHTML=stHtml();return}if('stsave' in d)return saveST();if('rfsave' in d)return saveRF();if('lksave' in d)return saveLinks();if(d.upadd!==undefined)return tkOpen(null);if(d.upedit)return tkOpen(d.upedit);if(d.updel)return tkDel(d.updel);if(d.uptog)return tkTog(d.uptog);if('upsave' in d)return tkSave();if('upcancel' in d)return tkClose();if('updef' in d)return tkDefaults();if('upset' in d)return tkSetSave();if('auadd' in d)return auAdd();if(d.auedit)return auEdit(d.auedit);if(d.audel)return auDel(d.audel);if('jgsave' in d)return saveJG();if('jgtest' in d)return testJG();if('lgclr' in d)return lgClear();if(d.lgdel)return lgDel(d.lgdel);if(d.lgf!==undefined){lgf=d.lgf;return draw()}if(d.go)return go(d.go);if(d.wt){wtab=d.wt;return draw()}if(d.wa)return decide(d.id,d.wa);if(d.ban)return ban(d.ban);if(d.user)return openUser(d.user);if(d.adp)return adSwitch(d.adp);if('adsave' in d)return adSave()});
document.addEventListener('input',e=>{if(e.target.id==='q'){qs=e.target.value;draw()}});
draw();
</script>
